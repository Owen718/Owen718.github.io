{{- $headers := findRE "<h[1-6].*?>(.|\n])+?</h[1-6]>" .Content -}}
{{- if ge (len $headers) 1 -}}
<div class="toc">
  <details {{ if (.Param "TocOpen") }}open{{ end }}>
    <summary accesskey="c" title="(Alt + C)">
      <span class="details">{{ if eq .Params.alternate_lang "en" }}目录{{ else }}Contents{{ end }}</span>
    </summary>
    <div class="inner">
      {{- .TableOfContents -}}
    </div>
  </details>
</div>
{{- end }}
